<style>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}

.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:14px;padding:8px 13px;font-weight:600;cursor:pointer;text-align:left;font-size:.95rem}
.send{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text],input[type=number],select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
details{background:var(--surface);border-radius:14px;padding:0 16px}

details>summary::after{content:"+";margin-left:auto;color:var(--muted);font-family:var(--body)} details[open]>summary::after{content:"–"}
details>.in{padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
details details{background:var(--surface2)}
dl{margin:0;display:flex;flex-direction:column;gap:8px} dt{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
[contenteditable]{border-bottom:1.5px dashed var(--line);padding-bottom:2px} [contenteditable]:focus{outline:0;border-bottom-color:var(--accent)}
ul.cl{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:14px;min-width:0}
.tile b{display:block;font-family:var(--display);font-size:1.55rem;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.tile span{font-size:.82rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:.9rem}
.bars .b{height:14px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px} .bars .v{font-variant-numeric:tabular-nums;font-weight:700}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle} th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.c,th.c{text-align:center} td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td input[type=text],td input[type=number]{padding:5px 8px;min-width:90px}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
.lock{border:1.5px dashed var(--line);background:none}
.nps{display:flex;gap:4px;flex-wrap:wrap} .nps button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer} .nps button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap} .thumbs figure{margin:0;width:92px;font-size:.72rem} .thumbs img,.ph-img{width:92px;height:92px;object-fit:cover;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:.72rem;text-align:center;padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:min(90vw,520px);font-size:.92rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
@media (prefers-reduced-motion:no-preference){.meter i,.bars .b{transition:width .4s}}

<script>
/* ============================================================================
   BLOCO 1 — INSTRUÇÕES DAS SKILLS (separado da interface, reaproveitável no app real)
   ============================================================================ */
const REGRAS_CONVERSA = `- Fale em português do Brasil, em linguagem de conversa, sem jargão de marketing.
- Faça UMA pergunta por vez.
- Se a resposta for rasa ou genérica (ex.: "atendimento de qualidade"), peça um exemplo real ou uma história antes de avançar.
- Nunca invente fatos, preços, números ou depoimentos da empresa. Se faltar um dado, pergunte.
- A cada 3 ou 4 respostas, devolva em 2 linhas o que entendeu e peça confirmação.
- Seja breve: no máximo 3 frases antes da pergunta.`;
const SKILLS = [
 {id:'identidade',n:1,nome:'Especialista em Identidade',etapa:'conhecer',papel:'Entrevista o dono e a equipe para registrar quem a empresa é.',le:'Setor, cidade, estudo do setor',escreve:'Identidade, referências, banco de mídia',refs:'Sinek (Comece pelo Porquê); Donald Miller (StoryBrand); Collins e Porras (Feitas para Durar); Mark e Pearson (arquétipos); Neumeier (The Brand Gap); Lencioni (A Vantagem Decisiva)',
  instrucoes:`Você é a Especialista em Identidade. Seu trabalho é ajudar o dono de uma pequena empresa a se enxergar. Conduza a entrevista em blocos: 1) a história (como nasceu, o momento da decisão); 2) o porquê (o que faria mesmo sem pensar no dinheiro; peça uma história real de cliente que marcou); 3) a transformação (como o cliente chega e como sai); 4) o cliente ideal; 5) a personalidade (se a empresa fosse uma pessoa); 6) empresas de referência e o que exatamente admira nelas; 7) fotos e materiais. Use, sem citar pelo nome, o Círculo Dourado, o StoryBrand (cliente é o herói, a marca é o guia) e arquétipos de marca. Valores devem virar comportamentos observáveis.`},
 {id:'diferenciais',n:2,nome:'Especialista em Diferenciais',etapa:'potencializar',papel:'Encontra o que a empresa tem de único e transforma em proposta clara.',le:'Identidade, pesquisa com clientes, estudo do setor',escreve:'Diferenciais e proposta de valor',refs:'Ries e Trout (Posicionamento); Kim e Mauborgne (Oceano Azul); Osterwalder (Value Proposition Design); Christensen (Jobs to Be Done); April Dunford (Obviously Awesome); Godin (A Vaca Roxa)',
  instrucoes:`Você é a Especialista em Diferenciais. Comece ouvindo o que a empresa entende por diferencial e o que faz a mais pelo cliente, usando a identidade já registrada para sugerir respostas. Teste cada diferencial com três perguntas: o cliente percebe e valoriza? o concorrente também faz? dá para provar? Reescreva diferenciais genéricos até ficarem específicos e comprováveis, ou descarte. Depois proponha como potencializar cada um e sugira diferenciais novos de baixo custo.`},
 {id:'experiencia',n:3,nome:'Especialista em Experiência do Cliente',etapa:'corrigir',papel:'Traz a verdade à tona sem culpar ninguém e transforma reclamação em plano.',le:'Identidade, diferenciais, pesquisa, avaliações',escreve:'Pontos negativos e plano de correção',refs:'Reichheld (NPS); Dixon (The Effortless Experience); Jay Baer (Hug Your Haters); Carlzon (A Hora da Verdade); Disney Institute; Toyota (5 porquês, PDCA)',
  instrucoes:`Você é a Especialista em Experiência do Cliente. Ouça as últimas reclamações, o que o dono vê de negativo e o que deu errado, sem julgar. Para cada problema, pergunte "por quê" até chegar à causa. Agrupe por tema, classifique por gravidade e frequência e proponha ação, responsável, prazo e como medir. Aponte incoerências entre o que a empresa promete e o que o cliente relata.`},
 {id:'marketing',n:4,nome:'Especialista em Marketing de Alta Conversão',etapa:'atrair',papel:'Define a estratégia de comunicação e produz perfis, conteúdos e ofertas.',le:'Tudo: identidade, diferenciais, correções, referências, mídia',escreve:'Estudo do setor, canais, calendário, ofertas',refs:'Hormozi ($100M Offers, $100M Leads); Cialdini; Schwartz (níveis de consciência); Berger (Contágio); Heath (Ideias que Colam); Vaynerchuk; Sheridan (They Ask, You Answer); Kotler (Marketing 4.0)',
  instrucoes:`Você é a Especialista em Marketing Digital de Alta Conversão para pequenos negócios locais. Tudo que você produz parte da identidade e do tom de voz da empresa; nada genérico. Cada peça pertence a uma linha de conteúdo e segue a ficha da linha. A oferta irresistível precisa fechar a conta com o que o cliente compra depois. Nunca crie escassez falsa, depoimento inventado ou promessa que a empresa não entrega. Você recomenda, mede e ajusta; não promete resultado garantido.`},
 {id:'atendente',n:5,nome:'Agente de Atendimento e Vendas',etapa:'vender',papel:'Atende no WhatsApp com foco em conversão, no tom da marca.',le:'Toda a base, ofertas ativas, conversas reais',escreve:'Atendimento (dúvidas, objeções, origem dos contatos)',refs:'Rackham (SPIN Selling); Dixon e Adamson (A Venda Desafiadora); Voss; Pink; Ross (Receita Previsível); Cialdini',
  instrucoes:`Você é o atendente virtual da empresa no WhatsApp. Responda curto, no tom de voz da marca. Entenda a necessidade antes de oferecer, apresente o diferencial certo, trate objeções e conduza ao próximo passo (pedir, agendar, pagar). Use só informações da base; se não souber, diga que vai confirmar com a equipe. Se perguntarem, diga que é um assistente virtual. Em reclamação séria ou pedido fora da regra, avise que vai passar para uma pessoa da equipe.`},
 {id:'treinador',n:6,nome:'Treinador de Equipe',etapa:'vender',papel:'Simula clientes, dá nota e mostra como melhorar.',le:'Base da empresa, roteiros, critérios de venda',escreve:'Equipe (notas, pontos fortes, treinos)',refs:'Ericsson (prática deliberada); Kim Scott (Empatia Assertiva); Coyle (O Código do Talento); obras de vendas da skill 5',
  instrucoes:`Você treina atendentes fazendo o papel de um cliente real no WhatsApp. Fique no personagem, escreva mensagens curtas e naturais, traga dúvidas e objeções típicas do perfil. Não facilite nem dificulte demais. Na avaliação, dê notas de 0 a 10 por critério (rapidez, cordialidade, escuta, uso dos diferenciais, tratamento de objeção, condução ao fechamento, fidelidade ao tom da marca) e trate a nota como ferramenta de desenvolvimento, não de punição.`},
 {id:'diario',n:7,nome:'Condutor Diário',etapa:'evoluir',papel:'Envia todo dia o lembrete, o desafio e a pergunta do dia.',le:'Diferenciais, pontos negativos, resultados',escreve:'Respostas do dia, participação da equipe',refs:'James Clear (Hábitos Atômicos); BJ Fogg; Duhigg; As 4 Disciplinas da Execução; kaizen',
  instrucoes:`Você mantém a equipe alinhada todos os dias. Crie um lembrete curto que reafirme um diferencial ou um ponto em correção, um desafio pequeno e possível de fazer hoje, e uma única pergunta rápida que traga informação nova. Varie os temas e priorize o que os dados mostram estar mais fraco.`},
 {id:'anuncios',n:8,nome:'Especialista em Anúncios Patrocinados',etapa:'atrair',papel:'Planeja, cria e acompanha anúncios pagos, em linguagem simples.',le:'Oferta, peças com melhor resultado, cliente ideal',escreve:'Anúncios (campanhas, verba, resultados)',refs:'Hopkins (A Ciência da Propaganda); Ogilvy; Schwartz; Hormozi ($100M Leads); Perry Marshall; políticas oficiais de Meta, Google e TikTok',
  instrucoes:`Você é a gestora de anúncios da empresa. Parta da oferta irresistível e das peças orgânicas que funcionaram. Comece com verba baixa e poucas variações, mantenha o que funciona e pause o resto. Nada é gasto sem aprovação da empresa. Explique cada índice com nome simples; a sigla vem depois. Onde não houver registro, diga "sem dado" em vez de estimar.`},
 {id:'resultados',n:9,nome:'Analista de Resultados',etapa:'evoluir',papel:'Mostra em uma tela como estão marketing e vendas, e o que fazer.',le:'Canais, anúncios, atendimento, equipe, pesquisa',escreve:'Resultados e aprendizados',refs:'Doerr (OKR); As 4 Disciplinas da Execução; Kaushik (Web Analytics 2.0); Ross; Reichheld',
  instrucoes:`Você escreve relatórios sempre na mesma ordem: o que aconteceu, por que aconteceu, o que fazer agora (no máximo três recomendações, por ordem de impacto), comparando com o período anterior. Nunca invente nem arredonde para melhor; número que não existe aparece como "sem dado", com a indicação de como coletar.`},
 {id:'reunioes',n:10,nome:'Condutor de Reuniões',etapa:'evoluir',papel:'Entrega ao líder a pauta pronta e acompanha os combinados.',le:'Resultados, notas, plano de correção, respostas do dia',escreve:'Reuniões e combinados',refs:'Grove (Gestão de Alta Performance); Lencioni (Death by Meeting); Harnish (Scaling Up); As 4 Disciplinas da Execução; Kim Scott; Bungay Stanier',
  instrucoes:`Você monta pautas de reunião a partir dos dados: poucos assuntos, bem tratados, com tempo para cada um e orientação de como conduzir. Desempenho individual só entra na reunião individual. Depois da reunião, transforme o registro do líder em tarefas com responsável e prazo.`},
 {id:'estrategista',n:11,nome:'Estrategista do Produto',etapa:'admin',papel:'Aconselha o administrador sobre planos, preços e estratégia comercial.',le:'Catálogo, planos, números do negócio (agregados)',escreve:'Rascunhos de plano, proposta comercial, testes',refs:'Ramanujam (Monetizing Innovation); Hermann Simon; Hormozi; ProfitWell; Van Westendorp; Mehta (Customer Success); Sean Ellis; Eric Ries; Geoffrey Moore; Wes Bush; Ariely',
  instrucoes:`Você é a Estrategista do Produto: conselheira de quem é dono deste aplicativo de marketing e vendas para pequenas empresas brasileiras. É especialista em produtos digitais por assinatura, planos, preços e estratégia comercial. Recomende sempre com o motivo, mostre o risco e sugira como testar barato. Não prometa sucesso garantido e não invente números de mercado; quando a recomendação vier de referências gerais e não dos dados do negócio, diga isso. As decisões são do administrador.`},
 {id:'orquestrador',n:0,nome:'Orquestrador',etapa:'todas',papel:'Conduz a jornada, aciona a skill certa e faz a checagem de coerência.',le:'Toda a base',escreve:'Próximo passo, alertas de coerência',refs:'—',
  instrucoes:`Você garante que toda entrega passou pela identidade e pelo tom de voz. Antes de liberar uma peça, confira se ela promete algo que a etapa Corrigir mostrou que a empresa ainda não entrega, e avise.`}
];
</script>

<script>
/* ============================================================================
   BLOCO 2 — CONFIGURAÇÃO E DADOS DE EXEMPLO (tudo aqui é fictício)
   ============================================================================ */
const CFG = {app:'Cinco Etapas',metodo:'Método das Cinco Etapas',etapas:[
 {id:'conhecer',nome:'Conhecer',frase:'Descobrir e registrar quem a empresa é.'},
 {id:'potencializar',nome:'Potencializar',frase:'Fortalecer o que a empresa tem de melhor.'},

 pecas:{skill:'marketing',chats:[],pedido:()=>'Crie 6 peças para a próxima semana, equilibrando estas linhas de conteúdo (use o id): '+S.linhas.filter(l=>l.ativa).map(l=>`${l.id} = ${l.nome}: ${l.conceito}`).join(' / '),formato:'{"pecas":[{"dia":"Seg","formato":"Reels|Stories|Foto|Carrossel|Post","linha":"id da linha","titulo":"","legenda":""}]}',
  aplicar:d=>{const p=arr(d.pecas);if(p.length)E().pecas=E().pecas.concat(p.map((x,i)=>({id:Date.now()+i,dia:str(x.dia),formato:str(x.formato),linha:linha(str(x.linha)).id||'identidade',titulo:str(x.titulo),legenda:str(x.legenda),st:'pend'})))}},
 oferta:{skill:'marketing',chats:[],pedido:'Proponha uma oferta irresistível de entrada que feche a conta. Onde faltar custo ou margem, escreva "confirmar com a empresa".',formato:'{"nome":"","oque":"","paraquem":"","porque":"","garantia":"","limite":"","custo":"","depois":""}',
  aplicar:d=>{if(str(d.nome))E().oferta=Object.fromEntries(['nome','oque','paraquem','porque','garantia','limite','custo','depois'].map(k=>[k,str(d[k])]))}},
 dia:{skill:'diario',chats:[],pedido:'Crie o lembrete, o desafio e a pergunta de hoje para a equipe.',formato:'{"lembrete":"","desafio":"","pergunta":"","sug":["resposta curta provável"]}',
  aplicar:d=>{const x=E().dia;if(str(d.desafio)){x.lembrete=str(d.lembrete);x.desafio=str(d.desafio);x.pergunta=str(d.pergunta);x.sug=arr(d.sug).map(str).slice(0,4);x.feito=false}}}
};
async function gerar(kind){const g=GER[kind];if(gen)return;if(!aiOk()){toast('A IA ao vivo não está disponível nesta visualização. Abra o artefato no claude.ai para gerar de verdade.');return}
 gen=kind;render();
 try{const pedido=typeof g.pedido==='function'?g.pedido():g.pedido;
  const d=await sampleFn.json(`${skill(g.skill).instrucoes}\n\nEMPRESA:\n${kbTexto()}\n\n${g.chats.map(c=>'CONVERSA ('+c+'):\n'+conversa(c)).join('\n\n')}\n\nTAREFA: ${pedido}\nNão invente fatos, preços ou números que a empresa não informou.\nResponda apenas com JSON neste formato: ${g.formato}`,{cache:false});
  g.aplicar(d||{});toast('Pronto. Revise e ajuste o que quiser.')}catch(e){aiErro(e)}
 gen=null;save();render()}
const btnGerar=(k,t)=>`<button class="btn primary" data-a="gerar" data-k="${k}" ${gen?'disabled':''}>${gen===k?'Gerando… pode levar um minuto':esc(t||'Gerar com a IA')}</button>`;

/* ---------- progresso ---------- */
function prog(id){const e=E();if(e.progresso)return e.progresso[id]||0;
 if(CH[id])return Math.min(100,Math.round(((S.chats[id]?.step||0)/CH[id].roteiro.length)*80)+((id==='conhecer'&&e.identidade.missao)||(id==='potencializar'&&e.diferenciais.length)||(id==='corrigir'&&e.negativos.length)?20:0));
 if(id==='atrair')return (Object.keys(e.perfis).length?35:0)+(e.pecas.length?35:0)+(e.oferta?30:0);
 return (S.chats.treino?.aval?50:0)+((S.chats.agente?.step||0)>0?50:0)}

function cabEtapa(id){const x=S.cfg.etapas.find(e=>e.id===id);return `<div><small>Etapa ${S.cfg.etapas.indexOf(x)+1} de 5</small><h1>${esc(x.nome)}</h1><p>${esc(x.frase)}</p></div>`}
function tabs(key,list){const cur=S.tab[key]||list[0];return `<div class="tabs" role="tablist">${list.map(t=>`<button class="${t===cur?'on':''}" data-a="tab" data-k="${key}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`}

const ed=(path,v)=>`<div contenteditable="true" data-edit="${path}">${esc(v)}</div>`;

V.conhecer=()=>{const t=S.tab.conhecer||'Conversa',i=E().identidade;

V.potencializar=()=>{const t=S.tab.potencializar||'Conversa',e=E();

function nps(){const r=E().pesquisa.respostas;if(!r.length)return null;const p=r.filter(x=>x.nota>=9).length,d=r.filter(x=>x.nota<=6).length;return Math.round((p-d)/r.length*100)}
V.corrigir=()=>{const t=S.tab.corrigir||'Conversa',e=E(),r=e.pesquisa.respostas,msg=`Oi! Aqui é da ${e.nome}. Queremos melhorar e a sua opinião vale muito. São 4 perguntas, 2 minutos, e você pode responder sem se identificar: [link da pesquisa]`;

 <label class="f">O que você mais gosta?<input type="text" id="p-gosta"></label><label class="f">O que poderia ser melhor?<input type="text" id="p-melhorar"></label><label class="f">Por que escolheu a gente?<input type="text" id="p-porque"></label>
 <small>Suas respostas são usadas só por ${esc(e.nome)} para melhorar. Você não precisa se identificar.</small><div><button class="btn primary">Enviar resposta</button></div></form></div>
 <h2>Resultado${r.length?` (${r.length} respostas)`:''}</h2>
 ${r.length?`<div class="tiles"><div class="tile"><span>Nota de recomendação (NPS)</span><b>${nps()}</b><span>de −100 a 100</span></div><div class="tile"><span>Nota média</span><b>${(r.reduce((a,x)=>a+x.nota,0)/r.length).toFixed(1).replace('.',',')}</b><span>de 0 a 10</span></div></div>

A['Método e skills']=()=>`<div><h2>Método</h2><small>Os nomes mudam no aplicativo inteiro.</small></div><div class="card"><div class="cols"><label class="f">Nome do aplicativo<input type="text" data-c="cfg" data-k="app" value="${esc(S.cfg.app)}"></label><label class="f">Nome do método<input type="text" data-c="cfg" data-k="metodo" value="${esc(S.cfg.metodo)}"></label></div>
 ${S.cfg.etapas.map((e,k)=>`<div class="row"><b>${k+1}</b><input type="text" data-c="etnome" data-i="${k}" value="${esc(e.nome)}" style="flex:1;min-width:120px" aria-label="Nome da etapa"><input type="text" data-c="etfrase" data-i="${k}" value="${esc(e.frase)}" style="flex:2;min-width:200px" aria-label="Frase da etapa"></div>`).join('')}</div>
 <div><h2>Skills</h2><small>As instruções abaixo são o que a IA recebe em cada conversa. Editar aqui muda o comportamento na hora.</small></div>
 ${SKILLS.map(s=>`<details><summary><span style="flex:1;min-width:0">${s.n?s.n+'. ':''}${esc(s.nome)}<br><small>${esc(s.papel)}</small></span></summary><div class="in"><dl><dt>Lê da base</dt><dd>${esc(s.le)}</dd><dt>Escreve na base</dt><dd>${esc(s.escreve)}</dd><dt>Referências</dt><dd>${esc(s.refs)}</dd><dt>Instruções</dt><dd><textarea rows="7" data-c="instr" data-id="${s.id}" aria-label="Instruções da skill">${esc(S.instr[s.id]||s.instrucoes)}</textarea></dd></dl></div></details>`).join('')}`;
A['Laboratório']=()=>`<div><h2>Laboratório de estratégias</h2><small>Linhas de conteúdo. A skill de marketing lê a ficha para saber o que produzir.</small></div>
 <div class="card"><h3>Nova linha de conteúdo</h3><form class="flat" data-f="novalinha"><input type="text" id="nl-nome" placeholder="Nome. Ex.: Pergunta polêmica" aria-label="Nome da linha"><textarea id="nl-exp" rows="2" placeholder="Explique com suas palavras o que é e para que serve"></textarea><div><button class="btn primary" ${gen?'disabled':''}>${gen==='linha'?'Montando a ficha…':'Criar linha'}</button></div></form><small>Com a IA ao vivo, a ficha vem completa e com exemplos. Sem ela, nasce com o seu texto para você completar.</small></div>
 ${S.linhas.map((l,k)=>`<details><summary>${chipLinha(l.id)}<span class="small">${l.nucleo?'do método':(l.rasc?'rascunho':'adicional')}</span><label class="row small" style="margin-left:auto"><input type="checkbox" data-c="linhaat" data-i="${k}" ${l.ativa?'checked':''}> ativa</label></summary><div class="in"><dl>${[['conceito','Conceito'],['objetivo','Objetivo'],['momento','Momento do cliente'],['estrategia','Estratégia'],['material','De onde vem o material'],['formatos','Formatos'],['cta','Chamada para ação'],['freq','Frequência'],['medida','Como medir'],['evitar','O que evitar'],['exemplos','Exemplos'],['refs','Referências']].filter(([f])=>l[f]||l.rasc).map(([f,t])=>`<dt>${t}</dt><dd>${ed('linhas.'+k+'.'+f,l[f]||'')}</dd>`).join('')}</dl></div></details>`).join('')}`;
A['Registro']=()=>`<div><h2>Registro de alterações</h2></div><div class="card">${S.log.length?`<div class="tw"><table><tr><th>Quando</th><th>Quem</th><th>O que mudou</th></tr>${S.log.map(l=>`<tr><td class="n">${esc(l.quando)}</td><td>${esc(l.quem)}</td><td>${esc(l.t)}</td></tr>`).join('')}</table></div>`:vazio('Nenhuma alteração ainda. Mudanças em planos, preços, skills e funcionalidades ficam registradas aqui.')}</div>`;
const ATABS=['Estrategista','Funcionalidades','Planos','Números','Proposta','Método e skills','Laboratório','Registro'];

/* ============================ RENDER ============================ */
const NAV=[['inicio','Início'],['empresa','Empresa'],['atrair',null],['vender',null],['evoluir',null]];
let lastKey='';
function render(){const adm=S.modo==='admin';const key=S.modo+'|'+S.view+'|'+JSON.stringify(S.tab);const open=[...document.querySelectorAll('main details')].map(d=>d.open);document.body.classList.toggle('admin',adm);
 const top=`<div class="top"><div><div class="brand"><span></span>${esc(S.cfg.app)}</div><div class="ia ${aiOk()?'on':''}"><i></i>${aiOk()?'IA ao vivo':'IA simulada'}</div>
 <div class="seg"><button class="${adm?'':'on'}" data-a="modo" data-m="cliente">Cliente</button><button class="${adm?'on':''}" data-a="modo" data-m="admin">Administrador</button></div></div></div>`;
 let body,nav='';
 if(adm){body=S.admin?`<div class="row"><small class="grow">Entrou como ${esc(S.admin)}</small><button class="btn sm" data-a="sair">Sair</button></div>${tabs('admin',ATABS)}${A[S.tab.admin||ATABS[0]]()}`:A.login()}
 else{const v=V[S.view]?S.view:'inicio';body=V[v]();
  const sec=['conhecer','potencializar','corrigir','planos'].includes(v)?'inicio':v;
  nav=v==='entrada'?'':`<nav class="nav"><div>${NAV.map(([id,l])=>`<button class="${sec===id?'on':''}" data-a="ir" data-v="${id}">${esc(l||(id==='evoluir'?S.cfg.evoluir.nome:S.cfg.etapas.find(e=>e.id===id).nome))}</button>`).join('')}</div></nav>`}
 $('#app').innerHTML=top+`<main class="wrap">${body}</main>`+nav;
 const ds=document.querySelectorAll('main details');if(key===lastKey&&ds.length===open.length)ds.forEach((d,i)=>d.open=open[i]);lastKey=key}

/* ============================ AÇÕES ============================ */
function setPath(path,val){const p=path.split('.');const roots={feats:S.feats,linhas:S.linhas,prop:S.proposta};let o=roots[p[0]]||E();const keys=roots[p[0]]?p.slice(1):p;
 for(let i=0;i<keys.length-1;i++)o=o[keys[i]];o[keys[keys.length-1]]=val;if(roots[p[0]])log('Editou '+(p[0]==='prop'?'a proposta comercial':p[0]==='feats'?'a funcionalidade '+S.feats[p[1]].nome:'a linha '+S.linhas[p[1]].nome))}
const ACT={
 modo:d=>{S.modo=d.m},ir:d=>{S.view=d.v;window.scrollTo(0,0)},tab:d=>{S.tab[d.k]=d.t},
 sug:d=>{chatSend(d.id,d.t);return false},
 gerar:d=>{gerar(d.k);return false},
 exemplo:()=>{S.empresa=clone(EXEMPLO);S.chats=clone(CHATS_EXEMPLO);S.view='inicio';S.autor=0},
 zero:()=>{S.view='entrada'},
 feito:()=>{E().dia.feito=!E().dia.feito},
 respdia:d=>{respDia(d.t)},
 negst:d=>{const n=E().negativos[d.i];n.st=n.st==='feito'?'andamento':'feito'},
 nota:d=>{pesq.nota=Number(d.n)},
 copiar:d=>{copiar($('#'+d.el).textContent);return false},copiartxt:d=>{copiar(d.t);return false},
 aprovar:d=>{const p=E().pecas.find(p=>p.id==d.i);p.st=p.st==='ok'?'pend':'ok'},
 aprovcamp:d=>{E().anuncios.campanhas[d.i].st='no ar';toast('Campanha aprovada. A veiculação é simulada.')},
 limpachat:d=>{delete S.chats[d.id]},
 plano:d=>{E().plano=d.id;toast('Simulando o plano '+planoAtual().nome+'.')},
 avaliar:()=>{avaliar();return false},
 login:()=>{S.admin=$('#adm-papel').value},sair:()=>{S.admin=null},
 novoplano:()=>{S.planos.push({id:'p'+Date.now(),nome:'Novo plano',para:'Descreva para quem é.',frase:'Frase de venda.',preco:0,teste:7,posts:12,usuarios:3,feats:[],clientes:0});log('Criou um plano em rascunho')},
 remplano:d=>{log('Removeu do rascunho o plano '+S.planos[d.i].nome);S.planos.splice(d.i,1)},
 publicar:()=>{S.publicado=clone(S.planos);if(!S.publicado.find(p=>p.id===E().plano))E().plano=S.publicado[0].id;log('Publicou os planos');toast('Planos publicados. A página de planos do cliente já mudou.')},
 descartar:()=>{S.planos=clone(S.publicado);log('Descartou o rascunho de planos')},
 sugplanos:()=>{sugPlanos();return false},
 aplicasug:()=>{const ids=S.feats.map(f=>f.id);S.planos=arr(S.sugestao.planos).map((p,k)=>({id:'s'+k+Date.now(),nome:str(p.nome)||'Plano',para:str(p.para),frase:str(p.frase),preco:Number(p.preco)||0,teste:7,posts:Number(p.posts)||12,usuarios:Number(p.usuarios)||3,feats:arr(p.feats).filter(x=>ids.includes(x)),clientes:0}));S.sugestao=null;S.tab.admin='Planos';log('Aplicou a sugestão da Estrategista como rascunho')},
 descartasug:()=>{S.sugestao=null}
};
function copiar(t){const ok=()=>toast('Copiado.');try{navigator.clipboard.writeText(t).then(ok).catch(()=>toast('Não foi possível copiar aqui. Selecione o texto e copie.'))}catch(e){toast('Não foi possível copiar aqui. Selecione o texto e copie.')}}
function respDia(t){t=str(t).trim();if(!t)return;E().respostasDia.push({quem:(E().equipe[S.autor]||E().equipe[0]).nome,t});toast('Resposta registrada. Ela alimenta os conteúdos e as pautas.')}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const fn=ACT[el.dataset.a];if(!fn)return;if(el.closest('summary'))ev.preventDefault();const r=fn(el.dataset,el);if(r!==false){save();render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.matches('.send textarea')){ev.preventDefault();ev.target.form.requestSubmit()}});
document.addEventListener('focusout',ev=>{const el=ev.target.closest&&ev.target.closest('[data-edit]');if(!el)return;setPath(el.dataset.edit,el.innerText.trim());save()});
const CH_={
 autor:el=>{S.autor=Number(el.value)},perfil:el=>{S.tab.perfil=el.value;delete S.chats.treino},
 comb:el=>{E().combinados[el.dataset.i].ok=el.checked},
 fotos:el=>{for(const f of el.files)thumbs.push({nome:f.name,url:URL.createObjectURL(f)});toast('Fotos adicionadas ao banco de mídia.')},
 featcusto:el=>{S.feats[el.dataset.i].custo=Number(el.value)||0;log('Alterou o custo de '+S.feats[el.dataset.i].nome)},
 featst:el=>{S.feats[el.dataset.i].st=el.value;log(`Situação de ${S.feats[el.dataset.i].nome}: ${el.value}`)},
 pnome:el=>{S.planos[el.dataset.i].nome=el.value},ppreco:el=>{S.planos[el.dataset.i].preco=Number(el.value)||0},
 pposts:el=>{S.planos[el.dataset.i].posts=Number(el.value)||0},pusers:el=>{S.planos[el.dataset.i].usuarios=Number(el.value)||1},
 pfeat:el=>{const p=S.planos[el.dataset.i],f=el.dataset.f;p.feats=el.checked?[...p.feats,f]:p.feats.filter(x=>x!==f)},
 cfg:el=>{S.cfg[el.dataset.k]=el.value;log('Renomeou: '+el.value)},
 etnome:el=>{S.cfg.etapas[el.dataset.i].nome=el.value;log('Renomeou a etapa para '+el.value)},etfrase:el=>{S.cfg.etapas[el.dataset.i].frase=el.value},
 instr:el=>{S.instr[el.dataset.id]=el.value;log('Editou as instruções da skill '+el.dataset.id)},
 linhaat:el=>{S.linhas[el.dataset.i].ativa=el.checked?1:0;log((el.checked?'Ativou':'Pausou')+' a linha '+S.linhas[el.dataset.i].nome)}
};
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-c]');if(!el)return;const fn=CH_[el.dataset.c];if(!fn)return;fn(el);save();if(el.dataset.c!=='instr')render()});
const FORMS={
 chat:f=>{const ta=f.querySelector('textarea');const t=ta.value;ta.value='';chatSend(f.dataset.id,t);return false},
 criar:()=>{S.empresa=vazia($('#n-nome').value.trim(),$('#n-setor').value.trim(),$('#n-cidade').value.trim(),$('#n-voce').value.trim());S.chats={};S.autor=0;S.view='conhecer';S.tab.conhecer='Conversa';const c=getChat('conhecer');c.msgs[0].t=`Prazer! Vamos começar pela história. Como a ${S.empresa.nome} nasceu?`},
 respdia:()=>{respDia($('#in-dia').value)},
 equipe:()=>{const n=$('#eq-nome').value.trim();if(n)E().equipe.push({nome:n,funcao:$('#eq-func').value.trim()||'Colaborador'})},
 ref:()=>{const n=$('#rf-nome').value.trim();if(n)E().referencias.push({nome:n,motivo:$('#rf-mot').value.trim()||'—'})},
 pesq:()=>{if(pesq.nota==null){toast('Escolha uma nota de 0 a 10.');return false}E().pesquisa.respostas.push({nota:pesq.nota,gosta:$('#p-gosta').value.trim(),melhorar:$('#p-melhorar').value.trim(),porque:$('#p-porque').value.trim()});pesq={nota:null};toast('Resposta recebida. Veja o resultado abaixo.')},
 ajuste:f=>{ajustar(f.dataset.i,$('#aj-'+f.dataset.i).value);return false},
 combinado:()=>{combinar($('#in-comb').value);return false},
 novafeat:()=>{novaFeat($('#nf-ideia').value);return false},
 novalinha:()=>{novaLinha($('#nl-nome').value,$('#nl-exp').value);return false}
};
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,fn=FORMS[f.dataset.f];if(!fn)return;if(fn(f)!==false){save();render()}});

/* ---------- ações que usam a IA, com reserva sem IA ---------- */
async function ajustar(id,pedido){pedido=str(pedido).trim();const p=E().pecas.find(p=>p.id==id);if(!pedido||!p||busy)return;
 if(!aiOk()){p.st='pend';toast('Pedido de ajuste registrado. Com a IA ao vivo, a legenda é reescrita na hora.');save();render();return}
 busy='aj'+id;render();try{const r=await sampleFn(`${skill('marketing').instrucoes}\n\nEMPRESA:\n${kbTexto()}\n\nLinha de conteúdo: ${linha(p.linha).nome} — ${linha(p.linha).conceito}\nTítulo: ${p.titulo}\nLegenda atual: ${p.legenda}\n\nA empresa pediu este ajuste: ${pedido}\n\nReescreva a legenda no tom de voz da empresa. Responda só com a nova legenda.`,{cache:false,modelTier:'quick'});p.legenda=r.text.trim();p.st='pend';toast('Legenda ajustada. Confira e aprove.')}catch(e){aiErro(e)}busy=null;save();render()}
async function avaliar(){const c=getChat('treino');if(c.msgs.filter(m=>m.r==='eu').length<1){toast('Responda ao cliente pelo menos uma vez antes de pedir a nota.');return}
 let av=null;if(aiOk()){gen='aval';render();try{av=await sampleFn.json(`${skill('treinador').instrucoes}\n\nEMPRESA:\n${kbTexto()}\n\nSIMULAÇÃO (IA = cliente; a outra parte = atendente em treino):\n${conversa('treino')}\n\nAvalie o atendente. Responda apenas com JSON: {"nota_atendente":0,"nota_cliente":0,"criterios":[{"nome":"Rapidez","nota":0},{"nome":"Cordialidade","nota":0},{"nome":"Escuta","nota":0},{"nome":"Uso dos diferenciais","nota":0},{"nome":"Objeção","nota":0},{"nome":"Fechamento","nota":0},{"nome":"Tom da marca","nota":0}],"foi_bem":"","melhorar":"","resposta_melhor":"uma resposta exemplar para o momento mais fraco"}`,{cache:false})}catch(e){aiErro(e)}gen=null}
 if(!av||av.nota_atendente==null)av={sim:true,nota_atendente:7,nota_cliente:6,criterios:[['Rapidez',8],['Cordialidade',8],['Escuta',6],['Uso dos diferenciais',5],['Objeção',6],['Fechamento',7],['Tom da marca',8]].map(([nome,nota])=>({nome,nota})),foi_bem:'Avaliação de exemplo: respondeu rápido e com simpatia.',melhorar:'Antes de justificar o preço, pergunte o que o cliente procura e apresente o diferencial.',resposta_melhor:'"R$ 32, feito na brasa na hora, com o pão que saiu do forno hoje. Você prefere mais simples ou caprichado?"'};
 c.aval=av;save();render();fim()}
async function combinar(txt){txt=str(txt).trim();if(!txt)return;let t=null;
 if(aiOk()){gen='comb';render();try{const d=await sampleFn.json(`${skill('reunioes').instrucoes}\n\nEquipe: ${E().equipe.map(p=>p.nome).join(', ')}.\nRegistro do líder depois da reunião:\n${txt}\n\nTransforme em tarefas. Responda apenas com JSON: [{"t":"tarefa","resp":"responsável","prazo":"prazo ou 'a definir'"}]`,{cache:false,modelTier:'quick'});t=arr(d).map(x=>({t:str(x.t),resp:str(x.resp)||'A definir',prazo:str(x.prazo)||'A definir',ok:false})).filter(x=>x.t)}catch(e){aiErro(e)}gen=null}
 if(!t||!t.length)t=txt.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({t:s,resp:'A definir',prazo:'A definir',ok:false}));
 E().combinados.push(...t);toast(t.length+' combinado(s) registrados.');save();render()}
async function novaFeat(ideia){ideia=str(ideia).trim();if(!ideia)return;let f=null;
 if(aiOk()){gen='feat';render();try{const d=await sampleFn.json(`${skill('estrategista').instrucoes}\n\nCatálogo atual: ${JSON.stringify(S.feats.map(f=>({id:f.id,nome:f.nome})))}\nSkills: ${SKILLS.map(s=>s.id).join(', ')}\nPlanos: ${S.planos.map(p=>p.nome).join(', ')}\n\nIdeia do administrador: ${ideia}\n\nPreencha a ficha. Responda apenas com JSON: {"nome":"","ben":"benefício para o cliente em uma frase","etapa":"conhecer|potencializar|corrigir|atrair|vender|evoluir","skill":"id da skill","dep":["ids do catálogo"],"tipo":"config (só configuração de algo existente) ou dev (exige programação)","espec":"o que precisa ser construído, o plano em que sugere colocar e por quê"}`,{cache:false});
  if(str(d.nome))f={id:'f'+Date.now(),nome:str(d.nome),ben:str(d.ben),etapa:str(d.etapa)||'evoluir',skill:str(d.skill)||'estrategista',dep:arr(d.dep).filter(x=>feat(x)),custo:0,st:'ideia',tipo:d.tipo==='config'?'config':'dev',espec:str(d.espec)}}catch(e){aiErro(e)}gen=null}
 if(!f)f={id:'f'+Date.now(),nome:ideia.slice(0,60),ben:ideia,etapa:'evoluir',skill:'estrategista',dep:[],custo:0,st:'ideia',tipo:'dev',espec:'Ficha criada sem a IA. Complete o benefício, a skill e as dependências.'};
 S.feats.push(f);log('Criou a funcionalidade '+f.nome+' como ideia');toast('Ficha criada como "ideia". Ela está no fim da lista.');save();render()}
async function novaLinha(nome,exp){nome=str(nome).trim();exp=str(exp).trim();if(!nome)return;const l={id:'l'+Date.now(),nome,cor:0,ativa:0,rasc:1,conceito:exp};
 if(aiOk()){gen='linha';render();try{const d=await sampleFn.json(`${skill('marketing').instrucoes}\n\nVocê está no Laboratório de estratégias. O administrador quer criar uma nova linha de conteúdo para pequenos negócios locais.\nNome: ${nome}\nExplicação: ${exp}\n\nComplete a ficha. Em "exemplos", escreva 3 ideias de peça para uma hamburgueria de bairro. Responda apenas com JSON: {"conceito":"","objetivo":"","momento":"","estrategia":"","material":"","formatos":"","cta":"","freq":"","medida":"","evitar":"","exemplos":"","refs":""}`,{cache:false});
  for(const k of ['conceito','objetivo','momento','estrategia','material','formatos','cta','freq','medida','evitar','exemplos','refs'])if(str(d[k]))l[k]=str(d[k])}catch(e){aiErro(e)}gen=null}
 S.linhas.push(l);log('Criou a linha de conteúdo '+nome+' como rascunho');toast('Linha criada como rascunho, pausada. Revise e marque como ativa.');save();render()}
async function sugPlanos(){let s=null;
 if(aiOk()){gen='sug';render();try{const d=await sampleFn.json(`${skill('estrategista').instrucoes}\n\nFuncionalidades (use os ids): ${JSON.stringify(S.feats.map(f=>({id:f.id,nome:f.nome,custo:f.custo,situacao:f.st,depende:f.dep})))}\nPlanos atuais: ${JSON.stringify(S.planos.map(p=>({nome:p.nome,preco:p.preco,feats:p.feats})))}\n\nProponha a estrutura de planos que você recomenda (de 2 a 4 planos), respeitando as dependências. Responda apenas com JSON: {"motivo":"3 frases: o raciocínio, o risco e como testar barato","planos":[{"nome":"","para":"","frase":"","preco":0,"posts":0,"usuarios":0,"feats":["ids"]}]}`,{cache:false});if(arr(d.planos).length)s=d}catch(e){aiErro(e)}gen=null}
 if(!s)s={sim:true,motivo:'Sugestão de exemplo, escrita à mão: três planos, com o atendente de WhatsApp no plano do meio para ele virar a escolha natural. Risco: o plano do meio pode tirar clientes do completo. Teste com os próximos 10 clientes antes de migrar os atuais.',planos:[{nome:'Essencial',para:'Quem está começando.',frase:'Sua empresa definida e seu conteúdo rodando.',preco:297,posts:12,usuarios:3,feats:[...BASICO]},{nome:'Profissional',para:'Quem já recebe mensagens e perde vendas.',frase:'Conteúdo e atendimento que vendem.',preco:497,posts:20,usuarios:6,feats:[...BASICO,'agente','treinador','reuniao_ind']},{nome:'Completo',para:'Quem quer acelerar com anúncios e vídeos.',frase:'Marketing e vendas de ponta a ponta.',preco:797,posts:30,usuarios:10,feats:[...BASICO,'agente','treinador','reuniao_ind','midia_ia','anuncios']}]};
 S.sugestao=s;save();render()}

render();
</script>
